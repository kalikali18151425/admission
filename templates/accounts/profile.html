{% load static %}
<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My profile</title><link rel="stylesheet" href="{% static 'css/style.css' %}"></head>
<body><main class="dashboard-container"><section class="dashboard-card"><h1>My profile</h1><p class="dashboard-description">Keep your contact and personal details up to date.</p>
{% for message in messages %}<p class="message">{{ message }}</p>{% endfor %}
<form method="post" enctype="multipart/form-data">{% csrf_token %}<div class="form-group"><label>Full name</label><input name="full_name" value="{{ request.user.first_name }}" required></div><div class="form-group"><label>Email</label><input type="email" name="email" value="{{ request.user.email }}"></div><div class="form-group"><label>Phone</label><input name="phone" value="{{ profile.phone }}" required></div><div class="form-group"><label>Date of birth</label><input type="date" name="date_of_birth" value="{{ profile.date_of_birth|date:'Y-m-d' }}"></div><div class="form-group"><label>Address</label><textarea name="address">{{ profile.address }}</textarea></div><div class="form-group"><label>Photo</label><input type="file" name="photo" accept="image/*"></div><button class="btn" type="submit">Save profile</button></form><p class="bottom-text"><a href="{% url 'dashboard' %}">Back to dashboard</a></p></section></main></body></html>
